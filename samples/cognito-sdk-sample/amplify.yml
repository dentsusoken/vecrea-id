version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - 'node --version'
            - 'npm install -g pnpm@11'
            - 'pnpm --version'
            - 'cd ../../projects/cognito-sdk && pnpm install --frozen-lockfile && pnpm run build'
            - 'pnpm install --frozen-lockfile'
        build:
          commands:
            - |
              set -e
              rm -f .env.production
              env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
              pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: samples/cognito-sdk-sample