version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
        - npm install -g pnpm@11
        - pnpm --version
        # Build the SDK first — sample depends on it via `file:` path
        - cd projects/cognito-sdk && pnpm install --frozen-lockfile && pnpm run build
        # Install sample dependencies (pnpm copies the built SDK from the file: path)
        - cd $CODEBUILD_SRC_DIR/samples/cognito-sdk-sample && pnpm install --frozen-lockfile
    build:
      commands:
        - cd $CODEBUILD_SRC_DIR/samples/cognito-sdk-sample && pnpm run build
  artifacts:
    baseDirectory: samples/cognito-sdk-sample/.next
    files:
      - '**/*'
  cache:
    paths:
      - projects/cognito-sdk/node_modules/**/*
      - samples/cognito-sdk-sample/node_modules/**/*
